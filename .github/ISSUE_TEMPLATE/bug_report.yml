name: Bug report
description: Report reproducible incorrect behavior in PathShelf
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove private paths, bookmark data, credentials, and personal files.
        Security vulnerabilities must follow SECURITY.md instead of this form.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Include the full version and build when available.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model
      description: Identify the Apple Silicon model.
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Location type
      options:
        - Local folder
        - iCloud-backed folder
        - Removable volume
        - Mounted network share
        - Not location-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence.
      placeholder: |
        1. Open the panel.
        2. Select a sanitized fixture.
        3. Perform the action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant output or screenshots without private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private paths, bookmark data, credentials, and personal files.
          required: true
        - label: This report is not a security vulnerability.
          required: true
